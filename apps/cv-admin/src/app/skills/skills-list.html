<h1>Compétences</h1>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (error(); as message) {
  <p role="alert" class="error">{{ message }}</p>
  <button mat-stroked-button type="button" (click)="load()">Réessayer</button>
} @else if (!loading()) {
  @if (skills().length === 0) {
    <p>Aucune compétence.</p>
  } @else {
    <div class="table-wrapper">
      <table mat-table [dataSource]="skills()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let skill">{{ skill.name }}</td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Catégorie</th>
          <td mat-cell *matCellDef="let skill">{{ skill.category }}</td>
        </ng-container>

        <ng-container matColumnDef="level">
          <th mat-header-cell *matHeaderCellDef>Niveau</th>
          <td mat-cell *matCellDef="let skill">{{ skill.level ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="variants">
          <th mat-header-cell *matHeaderCellDef>Variantes</th>
          <td mat-cell *matCellDef="let skill">{{ variantLabels(skill) || '—' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  }
}
