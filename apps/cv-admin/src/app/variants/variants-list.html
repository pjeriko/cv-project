<h1>Variantes</h1>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (error(); as message) {
  <p role="alert" class="error">{{ message }}</p>
  <button mat-stroked-button type="button" (click)="load()">Réessayer</button>
} @else if (!loading()) {
  @if (variants().length === 0) {
    <p>Aucune variante.</p>
  } @else {
    <div class="table-wrapper">
      <table mat-table [dataSource]="variants()">
        <ng-container matColumnDef="label">
          <th mat-header-cell *matHeaderCellDef>Libellé</th>
          <td mat-cell *matCellDef="let variant">{{ variant.label }}</td>
        </ng-container>

        <ng-container matColumnDef="slug">
          <th mat-header-cell *matHeaderCellDef>Slug</th>
          <td mat-cell *matCellDef="let variant">{{ variant.slug }}</td>
        </ng-container>

        <ng-container matColumnDef="summary">
          <th mat-header-cell *matHeaderCellDef>Résumé</th>
          <td mat-cell *matCellDef="let variant" class="summary">
            {{ variant.summary || '—' }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  }
}
