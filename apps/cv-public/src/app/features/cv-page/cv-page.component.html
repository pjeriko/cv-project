<div class="h-screen overflow-y-scroll snap-y snap-mandatory">
  @switch (state().status) {
    @case ('loading') {
      <section class="h-screen flex items-center justify-center snap-start">
        <p>Chargement…</p>
      </section>
    }
    @case ('not-found') {
      <section class="h-screen flex items-center justify-center snap-start">
        <p>Variante de CV introuvable.</p>
      </section>
    }
    @case ('error') {
      <section class="h-screen flex items-center justify-center snap-start">
        <p>Une erreur est survenue. Merci de réessayer plus tard.</p>
      </section>
    }
    @case ('success') {
      @if (cv(); as cvData) {
        <section class="h-screen snap-start">
          <app-profile-section [profile]="cvData.profile" [variant]="cvData.variant" />
        </section>
        <!-- Les 4 autres sections seront ajoutées une par une -->
        <section class="h-screen snap-start"><!-- SkillsSectionComponent --></section>
        <section class="h-screen snap-start"><!-- ExperiencesSectionComponent --></section>
        <section class="h-screen snap-start"><!-- EducationsSectionComponent --></section>
        <section class="h-screen snap-start"><!-- ProjectsSectionComponent --></section>
      }
    }
  }
</div>
