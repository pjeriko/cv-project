<div class="flex h-full flex-col overflow-y-auto p-6 md:p-8">
  <div class="my-auto flex flex-col gap-6">
    <h2 class="text-2xl">Compétences</h2>

    @if (groups().length > 0) {
      @for (group of groups(); track group.category) {
        <div>
          <h3 class="mb-2 text-sm uppercase tracking-wide text-accent">
            {{ group.category }}
          </h3>
          <ul class="flex flex-wrap gap-2">
            @for (skill of group.skills; track skill.id) {
              <li class="rounded-full border border-surface px-3 py-1 text-sm">
                {{ skill.name }}
                @if (skill.level) {
                  <span class="opacity-70">· {{ skill.level }}</span>
                }
              </li>
            }
          </ul>
        </div>
      }
    } @else {
      <p>Aucune compétence renseignée.</p>
    }
  </div>
</div>
